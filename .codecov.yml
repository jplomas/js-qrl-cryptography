# Coverage ratchet (QRL House Coding Playbook §4.4): the 100% milestone was
# reached 2026-06-13 and is locked in here and via c8 check-coverage in
# package.json. Dropping below 100% is a maintainer decision expressed as an
# explicit, reviewed change to these targets — never badge drift.
coverage:
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 100%

ignore:
  - "scripts/**/*"
  - "dist/**/*"
  - "test/**/*"
  - "test-builds/**/*"
  - "browser-tests/**/*"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: mldsa
      name: mldsa
      paths:
        - src/ml_dsa87.ts
    - component_id: hash
      name: hash
      paths:
        - src/keccak.ts
    - component_id: aes
      name: aes
      paths:
        - src/aes.ts
    - component_id: kdf
      name: kdf
      paths:
        - src/argon2id.ts
    - component_id: random
      name: random
      paths:
        - src/random.ts
    - component_id: utils
      name: utils
      paths:
        - src/utils.ts
