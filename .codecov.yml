coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "scripts/**/*"
  - "dist/**/*"
  - "test/**/*"
  - "test-builds/**/*"
  - "browser-tests/**/*"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: mldsa
      name: mldsa
      paths:
        - src/ml_dsa87.ts
    - component_id: hash
      name: hash
      paths:
        - src/keccak.ts
    - component_id: aes
      name: aes
      paths:
        - src/aes.ts
    - component_id: kdf
      name: kdf
      paths:
        - src/argon2id.ts
    - component_id: random
      name: random
      paths:
        - src/random.ts
    - component_id: utils
      name: utils
      paths:
        - src/utils.ts
